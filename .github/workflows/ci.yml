name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform, Python and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: python -m pip install pytest==9.1.1 pyspark==3.5.6

      - name: Check Python syntax
        run: python -m compileall -q scripts src tests

      - name: Run PySpark unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform with remote state
        run: terraform -chdir=terraform init -input=false

      - name: Create Terraform plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Apply Terraform plan
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan
